name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create (e.g. v1.2.3)'
        required: true
        type: string

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            raw_tag="${{ inputs.tag }}"
          else
            raw_tag="${GITHUB_REF_NAME}"
          fi
          # Normalize: ensure v prefix
          tag="${raw_tag}"
          [[ "${tag:0:1}" != "v" ]] && tag="v${tag}"
          version="${tag#v}"
          major="${version%%.*}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "major=${major}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.version.outputs.tag }}"
          generate_release_notes: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          # Node 24 bundles npm >= 11.5.1, the minimum npm CLI for Trusted Publishing.
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          # No cache in release builds (npm's guidance: a poisoned cache could run
          # attacker code with OIDC credentials).

      - run: pnpm install --frozen-lockfile

      - name: Sanity check — versions match the tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${TAG#v}"
          MCP=$(node -p "require('./packages/mcp-server/package.json').version")
          PLUGIN=$(node -p "require('./plugins/kolmopdf/.claude-plugin/plugin.json').version")
          MARKET=$(node -p "require('./.claude-plugin/marketplace.json').plugins[0].version")
          echo "tag=$TAG version=$VERSION mcp=$MCP plugin=$PLUGIN marketplace=$MARKET"
          test "$VERSION" = "$MCP" && test "$VERSION" = "$PLUGIN" && test "$VERSION" = "$MARKET" \
            || (echo "::error::version mismatch between tag and manifests" && exit 1)

      - run: pnpm -r build

      # npm Trusted Publishing (OIDC): with `id-token: write`, the npm CLI
      # (>= 11.5.1) exchanges this job's GitHub Actions OIDC token for a
      # short-lived npm publish token automatically — no NPM_TOKEN secret.
      # One-time setup on npmjs.com → package → Settings → Trusted Publisher:
      #   GitHub owner: komoai2026, repo: claude-plugin, workflow: release.yml
      - name: Publish @kolmopdf/mcp-server via Trusted Publishing
        working-directory: packages/mcp-server
        run: npm publish --access public
